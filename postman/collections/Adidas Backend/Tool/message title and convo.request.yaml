$kind: http-request
url: "{{base_url}}/tools/message"
method: POST
headers:
  Accept: application/json
body:
  type: json
  content: |-
    {
        "prompt": "Hi",
        "stream": 1
        // "conversation_id": "{{conversation_id}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
examples: ./.resources/message title and convo.resources/examples
order: 1000
