$kind: http-example
request:
  url: "{{base_url}}/carts/read-available?products={{product_id}}|{{size}},{{product_id2}}|{{size2}},{{product_id3}}|{{size3}},{{product_id4}}|{{size4}}"
  method: GET
  headers:
    Content-Type: application/json
    Accept: application/json
  queryParams:
    products: "{{product_id}}|{{size}},{{product_id2}}|{{size2}},{{product_id3}}|{{size3}},{{product_id4}}|{{size4}}"
response:
  statusCode: 200
  statusText: OK
  headers:
    Server: nginx/1.25.4
    Content-Type: application/json
    Transfer-Encoding: chunked
    Connection: keep-alive
    Vary: Accept-Encoding
    X-Powered-By: PHP/8.2.28
    Cache-Control: no-cache, private
    Date: Wed, 11 Mar 2026 14:07:03 GMT
    Access-Control-Allow-Origin: "*"
    Access-Control-Allow-Methods: GET, POST, PUT, DELETE
    Access-Control-Allow-Headers: Content-Type, X-Requested-With
    Strict-Transport-Security: max-age=31536000; includeSubDomains
    X-Content-Type-Options: nosniff
    Content-Encoding: gzip
  body:
    type: text
    content: |-
      [
          {
              "product_id": "01kf0vk7tnx7t1gd2vhexkxhwz",
              "sku": "JKDNL6_125",
              "stock": 10,
              "price": 87000,
              "price_sales": null
          }
      ]
order: 2000
