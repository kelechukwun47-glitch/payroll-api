$kind: http-example
request:
  url: "{{base_url}}/carts/read-available?products={{product_id}}|{{size}},{{product_id2}}|{{size2}},{{product_id3}}|{{size3}},{{product_id4}}|{{size4}}"
  method: GET
  headers:
    Content-Type: application/json
    Accept: application/json
  queryParams:
    products: "{{product_id}}|{{size}},{{product_id2}}|{{size2}},{{product_id3}}|{{size3}},{{product_id4}}|{{size4}}"
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Server
      value: nginx/1.25.4
    - key: Content-Type
      value: application/json
    - key: Transfer-Encoding
      value: chunked
    - key: Connection
      value: keep-alive
    - key: Vary
      value: Accept-Encoding
    - key: Vary
      value: Origin
    - key: X-Powered-By
      value: PHP/8.2.28
    - key: Cache-Control
      value: no-cache, private
    - key: Date
      value: Mon, 26 Jan 2026 08:01:56 GMT
    - key: Content-Encoding
      value: gzip
  body:
    type: text
    content: |-
      [
          {
              "product_id": "01kf0vk7tnx7t1gd2vhexkxhwz",
              "sku": "JKDNL6_125"
          }
      ]
order: 1000
